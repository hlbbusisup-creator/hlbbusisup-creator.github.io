<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HLB 유니버스 · 페이지 안내</title>
<style>body{margin:0;min-height:100vh;display:grid;place-content:center;padding:24px;background:#f9f2ec;color:#392c28;text-align:center;font-family:Arial,"Malgun Gothic",sans-serif;line-height:1.8}h1{font-size:24px}a{color:#a92d25}</style></head>
<body><main><h1>HLB 유니버스</h1><p id="message">페이지를 찾을 수 없습니다.</p><a id="open" href="/hlb-universe/">체험관으로 돌아가기</a></main>
<script>
  (()=>{
    if(!location.pathname.startsWith("/hlb-universe/"))return;
    const target=new URL("https://bhb2463-1.github.io/hlb-universe/");
    target.pathname=location.pathname;
    target.search=location.search;
    target.hash=location.hash;
    document.getElementById("message").textContent="새 주소의 자료로 연결하고 있습니다.";
    const link=document.getElementById("open");link.href=target.href;link.textContent="자료 열기";
    location.replace(target.href);
  })();
</script></body></html>
