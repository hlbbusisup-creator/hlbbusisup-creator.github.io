<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ef4136">
  <title>HLB 유니버스</title>
  <link rel="canonical" href="https://bhb2463-1.github.io/hlb-universe/">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{background:#f9f2ec;color:#392c28;font-family:Arial,"Malgun Gothic",sans-serif}
    .loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:12px;padding:24px}
    .loading b{justify-self:center;padding:8px 14px;border-radius:10px;background:#ef4136;color:#fff;font-size:32px;letter-spacing:-1px}
    .loading p{margin:0;font-size:14px;line-height:1.7}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;background:#f9f2ec}
    body[data-ready] iframe{opacity:1}body[data-ready] .loading{display:none}
    .open-site{position:fixed;z-index:2;left:50%;bottom:max(7px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:5px 10px;min-height:30px;display:flex;align-items:center;border:1px solid #fff9;border-radius:20px;background:#2f2927db;color:#fff;font-size:11px;line-height:1.5;text-decoration:none;white-space:nowrap}
    .open-site:hover{background:#24201e}.open-site:focus-visible{outline:3px solid #ef4136;outline-offset:3px}
    noscript{position:fixed;inset:0;display:grid;place-content:center;z-index:3;background:#f9f2ec;padding:24px;text-align:center;line-height:1.8}
    noscript a{color:#a92d25}
    @media(pointer:coarse){.open-site{min-height:36px;padding-inline:14px}}
  </style>
</head>
<body>
  <div class="loading" role="status"><b aria-hidden="true">HLB</b><p>HLB 유니버스를 불러오는 중입니다.<br>화면이 열리지 않으면 아래의 새 창으로 열기를 이용해 주세요.</p></div>
  <iframe id="universe" title="HLB 유니버스 온라인 체험관" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer"></iframe>
  <a class="open-site" id="open-site" href="https://bhb2463-1.github.io/hlb-universe/" target="_blank" rel="noopener noreferrer" aria-label="HLB 유니버스 새 창으로 열기">새 창으로 열기 ↗</a>
  <noscript><p>HLB 유니버스를 열려면<br><a href="https://bhb2463-1.github.io/hlb-universe/">사이트로 이동해 주세요.</a></p></noscript>
  <script>
    (()=>{
      const destination=new URL("https://bhb2463-1.github.io/hlb-universe/");
      destination.search=location.search;
      destination.hash=location.hash;
      const frame=document.getElementById("universe");
      document.getElementById("open-site").href=destination.href;
      frame.addEventListener("load",()=>{document.body.dataset.ready="";},{once:true});
      frame.src=destination.href;
    })();
  </script>
</body>
</html>
